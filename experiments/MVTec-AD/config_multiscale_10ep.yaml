version: v1.0.0
random_seed: 133
port: 11111

dataset:
  type: custom

  image_reader:
    type: opencv
    kwargs:
      image_dir: ../../data/MVTec-AD/mvtec_anomaly_detection/
      color_mode: RGB

  train:
    meta_file: ../../data/MVTec-AD/train.json
    rebalance: False
    hflip: False
    vflip: False
    rotate: False

  test:
    meta_file: ../../data/MVTec-AD/test.json

  input_size: [224,224] # [h,w]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  batch_size: 2
  workers: 4 # number of workers of dataloader for each process

criterion:
  - name: MultiScaleFeatureMSELoss
    type: MultiScaleFeatureMSELoss
    kwargs:
      weight: 1.0
      scale_weights: [1.0, 1.0, 1.0]

trainer:
  aux_weight: 0.01
  max_epoch: 10
  clip_max_norm: 0.1
  val_freq_epoch: 10
  print_freq_step: 1
  tb_freq_step: 1
  lr_scheduler:
    type: StepLR
    kwargs:
      step_size: 800
      gamma: 0.1
  optimizer:
    type: AdamW
    kwargs:
      lr: 0.0002
      betas: [0.9, 0.999]
      weight_decay: 0.0001

saver:
  auto_resume: False
  always_save: False
  load_path: null
  save_dir: checkpoints_multiscale/
  log_dir: log_multiscale/

evaluator:
  save_dir: result_eval_temp
  key_metric: mean_pixel_auc
  metrics:
    auc:
      - name: std
      - name: max
        kwargs:
          avgpool_size: [16, 16]
      - name: pixel
  vis_compound:
    save_dir: vis_compound
    max_score: null
    min_score: null
  # vis_single:
  #   save_dir: vis_single
  #   max_score: null
  #   min_score: null

frozen_layers: [backbone]

net:
  - name: backbone
    type: models.backbones.efficientnet_b4
    frozen: True
    kwargs:
      pretrained: True
      outlayers: [2, 3, 4]
  - name: neck
    prev: backbone
    type: models.necks.multiscale_neck.MultiScaleNeck
    kwargs:
      hidden_dim: 128
      use_fpn: False
      use_simam: False
      jitter_scale: 20.0
  - name: reconstruction
    prev: neck
    type: models.reconstructions.multiscale_moead.MultiScaleMoEAD
    kwargs:
      nhead: 4
      depths: [2, 3, 4]
      moe_nume: 4
      moe_topk: 2
      dim_feedforward: 512
      dropout: 0.1
      local_window: 7
      local_exclusion_px: [4, 8, 16]
      cross_window: 5
      cross_exclusion_px: 0.0
      use_cross: True
      score_weights: [1.0, 1.0, 1.0]
      query_chunk: 128

